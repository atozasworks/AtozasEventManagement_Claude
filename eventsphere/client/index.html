<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>EventSphere - Discover, host and run every kind of event</title>
    <meta name="theme-color" content="#131538" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/icons/icon-192.png" />
    <link rel="apple-touch-icon" href="/icons/icon-192.png" />
    <script>
      (function () {
        try {
          var theme = localStorage.getItem('es_theme') === 'dark' ? 'dark' : 'light';
          document.documentElement.dataset.theme = theme;
          var lang = localStorage.getItem('es_lang') || 'en';
          document.documentElement.lang = lang;
          if (/googtrans/i.test(location.hash)) history.replaceState(null, '', location.pathname + location.search);
          var host = location.hostname;
          var domains = [''];
          if (host && host !== 'localhost' && !/^\d+\.\d+\.\d+\.\d+$/.test(host)) {
            domains.push(host, '.' + host);
            var parts = host.split('.');
            for (var i = 1; i < parts.length - 1; i++) domains.push('.' + parts.slice(i).join('.'));
          }
          var expire = 'expires=Thu, 01 Jan 1970 00:00:00 GMT';
          for (var d = 0; d < domains.length; d++) {
            document.cookie = 'googtrans=;path=/;' + expire + (domains[d] ? ';domain=' + domains[d] : '');
          }
          if (lang && lang !== 'en') document.cookie = 'googtrans=/en/' + lang + ';path=/';
        } catch (e) {}
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700;12..96,800&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
